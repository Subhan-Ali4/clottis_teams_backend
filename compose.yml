services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clottis_teams
      POSTGRES_USER: clottis
      POSTGRES_PASSWORD: clottis
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clottis -d clottis_teams"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
