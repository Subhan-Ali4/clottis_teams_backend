name: CLOTTIS Teams Backend — Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clottis-teams-backend-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: clottis-teams-backend:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/backend.tar
          cache-from: type=gha,scope=clottis-teams-backend
          cache-to: type=gha,mode=max,scope=clottis-teams-backend
      - uses: actions/upload-artifact@v4
        with:
          name: clottis-teams-backend-image
          path: ${{ runner.temp }}/backend.tar
          retention-days: 1

  deploy:
    if: ${{ vars.ENABLE_PRODUCTION_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clottis-teams-backend-image
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}" "${SSH_HOST:?Missing SSH_HOST}" "${SSH_USER:?Missing SSH_USER}" "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Transfer and deploy image
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          scp -o StrictHostKeyChecking=yes backend.tar "$SSH_USER@$SSH_HOST:/tmp/clottis-teams-backend-$SHA.tar"
          ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "set -eu; test -x /home/dev/clottis-teams/deployment/deploy-backend.sh; docker load -i /tmp/clottis-teams-backend-$SHA.tar; rm /tmp/clottis-teams-backend-$SHA.tar; /home/dev/clottis-teams/deployment/deploy-backend.sh 'clottis-teams-backend:$SHA'"
      - name: Verify public backend
        run: curl --fail --show-error --retry 5 --retry-delay 5 https://team.clottis.net/api/v1/health
